<section>
  <h1>Login</h1>

  @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }

  @if (loading) {
    <p>Logging in...</p>
  }

  <app-login-form
    (submitForm)="onLogin($event)"
  ></app-login-form>

  <p>
    <a routerLink="/forgot-password">Forgot password?</a>
  </p>

  <p>
    Don't have an account?
    <a routerLink="/register">Register</a>
  </p>
</section>
