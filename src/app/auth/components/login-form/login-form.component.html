<form (ngSubmit)="onSubmit()">
  <div>
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      required
      email
    >
  </div>

  <div>
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      required
    >
  </div>

  <button type="submit">Login</button>
</form>
